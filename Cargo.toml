[package]
name = "whitespine"
authors = ["Miloslav Macurek"]
version = "1.4.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chess = "3.2.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true

[lints.clippy]
all = { level = "warn", priority = -1 }
